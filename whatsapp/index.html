<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City Norte Segurança & Tecnologia</title>
</head>

<body style="font-family:Arial;text-align:center;padding:30px">

  <h3>City Norte Segurança & Tecnologia</h3>
  <p id="status">Preparando seu acesso ao WhatsApp...</p>

  <a id="manual" href="https://wa.me/5591981899328?text=Ol%C3%A1%21%20Vim%20pelo%20an%C3%BAncio%20do%20Facebook%20e%20gostaria%20de%20mais%20informa%C3%A7%C3%B5es%20sobre%20os%20produtos.">
    Clique aqui se não for redirecionado.
  </a>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyqTzv5yqwt5Of2QKj2fVbdKWF_xW0Hpf9ZZ-24WZ-wl1VPMYf0gBxBDoMUF3KU3ZXL/exec";
    const WHATSAPP_URL = document.getElementById("manual").href;

    let redirecionado = false;

    function abrirWhatsApp() {
      if (redirecionado) return;
      redirecionado = true;
      window.location.replace(WHATSAPP_URL);
    }

    function comTimeout(promessa, ms) {
      return Promise.race([
        promessa,
        new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))
      ]);
    }

    async function obterIP() {
      try {
        const r = await comTimeout(
          fetch("https://api.ipify.org?format=json", { cache: "no-store" }),
          2000
        );
        const d = await r.json();
        return d.ip || "";
      } catch (e) {
        return "";
      }
    }

    async function iniciar() {
      // garante o redirecionamento mesmo se algo travar
      setTimeout(abrirWhatsApp, 4500);

      const ip = await obterIP();

      const url = SCRIPT_URL +
        "?ip=" + encodeURIComponent(ip) +
        "&origem=" + encodeURIComponent("Facebook") +
        "&t=" + Date.now();

      try {
        await comTimeout(
          fetch(url, { mode: "no-cors", keepalive: true, cache: "no-store" }),
          3000
        );
      } catch (e) {
        console.error("Erro no contador:", e);
      }

      abrirWhatsApp();
    }

    iniciar();
  </script>
</body>
</html>
