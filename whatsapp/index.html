
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City Norte Segurança & Tecnologia</title>
</head>

<body style="font-family:Arial;text-align:center;padding:30px">

  <h3>City Norte Segurança & Tecnologia</h3>
  <p id="status">Preparando acesso ao WhatsApp...</p>

  <a id="linkWhatsApp"
     href="https://wa.me/5591981899328?text=Ol%C3%A1%21%20Vim%20pelo%20an%C3%BAncio%20do%20Facebook%20e%20gostaria%20de%20mais%20informa%C3%A7%C3%B5es%20sobre%20os%20produtos.">
    Clique aqui se não for redirecionado.
  </a>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyqTzv5yqwt5Of2QKj2fVbdKWF_xW0Hpf9ZZ-24WZ-wl1VPMYf0gBxBDoMUF3KU3ZXL/exec";

    async function iniciar() {
      const status = document.getElementById("status");

      try {
        status.textContent = "Consultando conexão...";

        const resposta = await fetch(
          "https://api.ipify.org?format=json",
          { cache: "no-store" }
        );

        if (!resposta.ok) {
          throw new Error("Não foi possível consultar a conexão.");
        }

        const dados = await resposta.json();

        status.textContent = "Preparando redirecionamento...";

        const destino =
          SCRIPT_URL +
          "?ip=" + encodeURIComponent(dados.ip) +
          "&origem=" + encodeURIComponent("Facebook");

        window.location.replace(destino);

      } catch (erro) {
        console.error("Erro:", erro);

        status.textContent =
          "Não foi possível verificar a conexão. Tente novamente.";
      }
    }

    iniciar();
  </script>

</body>
</html>
